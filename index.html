<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文詞彙小偵探 - 學習專區</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-light: #e0f2fe;
      --primary-dark: #0369a1;
      --secondary: #f59e0b;
      --accent: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      padding: 22px 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
    }

    header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    header p {
      font-size: 13px;
      opacity: 0.9;
      margin-top: 4px;
    }

    nav {
      display: flex;
      justify-content: center;
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      overflow-x: auto;
    }

    .nav-btn {
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: transparent;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .nav-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background-color: var(--primary-light);
    }

    main {
      max-width: 960px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: white;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .select-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    select, input, textarea {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
      background: white;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-audio {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #bae6fd;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
    }
    .btn-audio:hover { background: #bae6fd; }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .word-card {
      background: white;
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .word-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .word-title {
      font-size: 19px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .word-meaning {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin: 10px 0 6px 0;
    }

    .badge-unit {
      font-size: 11px;
      background: #fef3c7;
      color: #b45309;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .badge-grade {
      font-size: 11px;
      background: #e0f2fe;
      color: #0369a1;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      margin-right: 4px;
    }

    /* Flashcard Style */
    .flashcard-wrapper {
      perspective: 1000px;
      max-width: 440px;
      margin: 30px auto;
    }

    .flashcard {
      background: white;
      border: 2px solid var(--border);
      border-radius: 20px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      cursor: pointer;
      position: relative;
    }

    /* Quiz Style */
    .quiz-container {
      background: white;
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 28px;
      max-width: 600px;
      margin: 20px auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }

    .quiz-options {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .quiz-opt-btn {
      padding: 14px 18px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    .quiz-opt-btn:hover { border-color: var(--primary); background: var(--primary-light); }
    .quiz-opt-btn.correct { background: #dcfce7; border-color: #22c55e; color: #15803d; }
    .quiz-opt-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }

    /* G8 Form Style */
    .form-panel {
      background: white;
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
    }

    .form-item {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>英文詞彙小偵探</h1>
    <p>國中英語 G7 / G8 核心單字・即時發音庫</p>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('vocab')">📚 單字庫</button>
    <button class="nav-btn" onclick="switchTab('card')">🃏 翻卡記憶</button>
    <button class="nav-btn" onclick="switchTab('quiz')">🕵️ 偵探測驗</button>
    <button class="nav-btn" onclick="switchTab('g8')">⚙️ G8</button>
  </nav>

  <main>
    <!-- 單字庫 Panel -->
    <section id="panel-vocab">
      <div class="filter-bar">
        <div class="select-group">
          <label><strong>冊別：</strong></label>
          <select id="gradeSelect" onchange="onGradeChange()">
            <option value="ALL">全部冊別</option>
            <option value="G8" selected>G8 (八年級)</option>
            <option value="G7 A">G7 A (七年級上)</option>
            <option value="G7 B">G7 B (七年級下)</option>
          </select>

          <label><strong>單元：</strong></label>
          <select id="unitSelect" onchange="renderVocabGrid()"></select>
        </div>
        <span id="wordCountBadge" style="font-size: 13px; color: var(--text-muted);">共 0 個單字</span>
      </div>
      <div id="vocabGrid" class="word-grid"></div>
    </section>

    <!-- 翻卡練習 Panel -->
    <section id="panel-card" style="display:none;">
      <div class="filter-bar">
        <div class="select-group">
          <label><strong>冊別：</strong></label>
          <select id="cardGradeSelect" onchange="onCardGradeChange()">
            <option value="ALL">全部冊別</option>
            <option value="G8" selected>G8 (八年級)</option>
            <option value="G7 A">G7 A (七上)</option>
            <option value="G7 B">G7 B (七下)</option>
          </select>
          <label><strong>單元：</strong></label>
          <select id="cardUnitSelect" onchange="resetCard()"></select>
        </div>
        <span id="cardProgress" style="font-size: 13px; color: var(--text-muted);">1 / 1</span>
      </div>
      <div class="flashcard-wrapper">
        <div class="flashcard" onclick="flipCard()">
          <div style="position: absolute; top: 16px; left: 16px;">
            <span class="badge-grade" id="cardGradeBadge">G8</span>
            <span class="badge-unit" id="cardUnitBadge">A Unit 1</span>
          </div>
          <div id="cardFront">
            <h2 id="cardWord" style="font-size: 34px; color: var(--primary-dark); font-weight: 800;">Word</h2>
            <button class="btn btn-audio" style="margin-top: 16px;" onclick="event.stopPropagation(); playCurrentCardAudio();">🔊 發音</button>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 24px;">點擊卡片查看中文解釋</p>
          </div>
          <div id="cardBack" style="display:none;">
            <h3 id="cardMeaning" style="font-size: 24px; font-weight: 700; color: #0f172a;">釋義</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 24px;">點擊翻回正面</p>
          </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 16px; margin-top: 20px;">
          <button class="btn btn-primary" onclick="prevCard()">上一張</button>
          <button class="btn btn-primary" onclick="nextCard()">下一張</button>
        </div>
      </div>
    </section>

    <!-- 測驗 Panel -->
    <section id="panel-quiz" style="display:none;">
      <div class="quiz-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <div>
            <span class="badge-grade" id="quizGradeBadge">G8</span>
            <span class="badge-unit" id="quizUnitBadge">A Unit 1</span>
          </div>
          <span id="quizScore" style="font-weight: 700; color: var(--secondary);">得分: 0</span>
        </div>
        <div style="text-align: center; margin: 20px 0;">
          <h2 id="quizQuestion" style="font-size: 32px; color: var(--primary-dark); font-weight: 800;">Question</h2>
          <button class="btn btn-audio" style="margin-top: 10px;" onclick="playQuizAudio()">🔊 聽發音</button>
        </div>
        <div id="quizOptions" class="quiz-options"></div>
        <div style="margin-top: 24px; text-align: right;">
          <button class="btn btn-primary" onclick="nextQuizQuestion()">下一題 ➔</button>
        </div>
      </div>
    </section>

    <!-- G8 管理 Panel -->
    <section id="panel-g8" style="display:none;">
      <div class="form-panel">
        <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--primary-dark);">新增 G8 單字資料庫</h2>
        <div class="form-item">
          <label><strong>選擇單元 (A Unit)：</strong></label>
          <select id="newG8Unit">
            <option value="A Unit 1">A Unit 1</option>
            <option value="A Unit 2">A Unit 2</option>
            <option value="A Unit 3">A Unit 3</option>
            <option value="A Unit 4">A Unit 4</option>
            <option value="A Unit 5">A Unit 5</option>
            <option value="A Unit 6">A Unit 6</option>
          </select>
        </div>
        <div class="form-item">
          <label><strong>英文單字：</strong></label>
          <input type="text" id="newG8Word" placeholder="例如：vacation">
        </div>
        <div class="form-item">
          <label><strong>中文釋義：</strong></label>
          <input type="text" id="newG8Meaning" placeholder="例如：假期">
        </div>
        <button class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;" onclick="addNewG8Word()">儲存至 G8 題庫</button>
      </div>
    </section>
  </main>

    let wordDatabase = JSON.parse(localStorage.getItem('word_detective_db')) || RAW_DATABASE;

    // 音訊播放引擎 (針對 Android Chrome / iOS 全面優化)
    function playAudio(text) {
      if (!('speechSynthesis' in window)) {
        alert("您的裝置瀏覽器不支援發音功能");
        return;
      }
      window.speechSynthesis.cancel();
      setTimeout(() => {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 0.85;
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang === 'en-US' || v.lang.startsWith('en'));
        if (enVoice) utter.voice = enVoice;
        window.speechSynthesis.speak(utter);
      }, 50);
    }

    if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // 分頁切換
    function switchTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('panel-vocab').style.display = tab === 'vocab' ? 'block' : 'none';
      document.getElementById('panel-card').style.display = tab === 'card' ? 'block' : 'none';
      document.getElementById('panel-quiz').style.display = tab === 'quiz' ? 'block' : 'none';
      document.getElementById('panel-g8').style.display = tab === 'g8' ? 'block' : 'none';

      if (tab === 'vocab') renderVocabGrid();
      if (tab === 'card') resetCard();
      if (tab === 'quiz') startQuiz();
    }

    // 單元選單聯動更新
    function updateUnitOptions(gradeSelectId, unitSelectId) {
      const grade = document.getElementById(gradeSelectId).value;
      const unitSelect = document.getElementById(unitSelectId);
      
      const filtered = grade === 'ALL' 
        ? wordDatabase 
        : wordDatabase.filter(w => w.grade === grade);

      const units = Array.from(new Set(filtered.map(w => w.unit))).sort();

      unitSelect.innerHTML = '<option value="ALL">全部 A Unit</option>' +
        units.map(u => `<option value="${u}">${u}</option>`).join('');
    }

    function onGradeChange() {
      updateUnitOptions('gradeSelect', 'unitSelect');
      renderVocabGrid();
    }

    function onCardGradeChange() {
      updateUnitOptions('cardGradeSelect', 'cardUnitSelect');
      resetCard();
    }

    // 單字庫渲染
    function renderVocabGrid() {
      const grade = document.getElementById('gradeSelect').value;
      const unit = document.getElementById('unitSelect').value;
      const container = document.getElementById('vocabGrid');

      let list = wordDatabase;
      if (grade !== 'ALL') list = list.filter(w => w.grade === grade);
      if (unit && unit !== 'ALL') list = list.filter(w => w.unit === unit);

      document.getElementById('wordCountBadge').innerText = `共 ${list.length} 個單字`;

      container.innerHTML = list.map(item => `
        <div class="word-card">
          <div>
            <div class="card-top">
              <div>
                <span class="badge-grade">${item.grade}</span>
                <span class="badge-unit">${item.unit}</span>
              </div>
              <button class="btn btn-audio" onclick="playAudio('${item.word}')">🔊 發音</button>
            </div>
            <div class="word-title">${item.word}</div>
            <div class="word-meaning">${item.meaning}</div>
          </div>
        </div>
      `).join('');
    }

    // 翻卡練習邏輯
    let cardList = [];
    let currentCardIdx = 0;
    let isFlipped = false;

    function resetCard() {
      const grade = document.getElementById('cardGradeSelect').value;
      const unit = document.getElementById('cardUnitSelect').value;

      let list = wordDatabase;
      if (grade !== 'ALL') list = list.filter(w => w.grade === grade);
      if (unit && unit !== 'ALL') list = list.filter(w => w.unit === unit);

      cardList = list;
      currentCardIdx = 0;
      isFlipped = false;
      renderCard();
    }

    function renderCard() {
      if (cardList.length === 0) return;
      const card = cardList[currentCardIdx];
      document.getElementById('cardProgress').innerText = `${currentCardIdx + 1} / ${cardList.length}`;
      document.getElementById('cardGradeBadge').innerText = card.grade;
      document.getElementById('cardUnitBadge').innerText = card.unit;
      document.getElementById('cardWord').innerText = card.word;
      document.getElementById('cardMeaning').innerText = card.meaning;

      document.getElementById('cardFront').style.display = isFlipped ? 'none' : 'block';
      document.getElementById('cardBack').style.display = isFlipped ? 'block' : 'none';
    }

    function flipCard() {
      isFlipped = !isFlipped;
      renderCard();
    }

    function nextCard() {
      if (currentCardIdx < cardList.length - 1) {
        currentCardIdx++;
        isFlipped = false;
        renderCard();
      }
    }

    function prevCard() {
      if (currentCardIdx > 0) {
        currentCardIdx--;
        isFlipped = false;
        renderCard();
      }
    }

    function playCurrentCardAudio() {
      if (cardList[currentCardIdx]) playAudio(cardList[currentCardIdx].word);
    }

    // 測驗邏輯
    let quizWord = null;
    let quizScore = 0;

    function startQuiz() {
      quizScore = 0;
      document.getElementById('quizScore').innerText = `得分: ${quizScore}`;
      nextQuizQuestion();
    }

    function nextQuizQuestion() {
      if (wordDatabase.length < 4) return;
      quizWord = wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
      document.getElementById('quizGradeBadge').innerText = quizWord.grade;
      document.getElementById('quizUnitBadge').innerText = quizWord.unit;
      document.getElementById('quizQuestion').innerText = quizWord.word;

      playAudio(quizWord.word);

      const options = [quizWord.meaning];
      while (options.length < 4) {
        const rand = wordDatabase[Math.floor(Math.random() * wordDatabase.length)].meaning;
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      const optsContainer = document.getElementById('quizOptions');
      optsContainer.innerHTML = options.map(opt => `
        <button class="quiz-opt-btn" onclick="checkAnswer(this, '${opt}')">${opt}</button>
      `).join('');
    }

    function playQuizAudio() {
      if (quizWord) playAudio(quizWord.word);
    }

    function checkAnswer(btn, selected) {
      const isCorrect = selected === quizWord.meaning;
      document.querySelectorAll('.quiz-opt-btn').forEach(b => {
        b.disabled = true;
        if (b.innerText === quizWord.meaning) b.classList.add('correct');
      });
      if (isCorrect) {
        btn.classList.add('correct');
        quizScore += 10;
        document.getElementById('quizScore').innerText = `得分: ${quizScore}`;
      } else {
        btn.classList.add('wrong');
      }
    }

    // G8 題庫新增邏輯
    function addNewG8Word() {
      const unit = document.getElementById('newG8Unit').value;
      const word = document.getElementById('newG8Word').value.trim();
      const meaning = document.getElementById('newG8Meaning').value.trim();

      if (!word || !meaning) {
        alert("請輸入英文單字與中文釋義！");
        return;
      }

      wordDatabase.push({ grade: "G8", unit, word, meaning });
      localStorage.setItem('word_detective_db', JSON.stringify(wordDatabase));

      alert(`已成功將「${word}」加入至 G8 ${unit}！`);
      document.getElementById('newG8Word').value = '';
      document.getElementById('newG8Meaning').value = '';

      updateUnitOptions('gradeSelect', 'unitSelect');
      updateUnitOptions('cardGradeSelect', 'cardUnitSelect');
    }

    // 啟動初始化
    updateUnitOptions('gradeSelect', 'unitSelect');
    updateUnitOptions('cardGradeSelect', 'cardUnitSelect');
    renderVocabGrid();
  </script>
</body>
</html>
