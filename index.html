<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英文詞彙小偵探 - G8 探索專區</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-light: #e0f2fe;
      --primary-dark: #0369a1;
      --secondary: #f59e0b;
      --accent: #10b981;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 60px;
    }

    header {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: white;
      padding: 24px 16px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.2);
    }

    header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 0.05em;
    }

    header p {
      font-size: 14px;
      opacity: 0.9;
      margin-top: 4px;
    }

    nav {
      display: flex;
      justify-content: center;
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      overflow-x: auto;
    }

    .nav-btn {
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: transparent;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .nav-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background-color: var(--primary-light);
    }

    main {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: white;
      padding: 12px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .select-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    select, input, textarea {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
    }

    select:focus, input:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px var(--primary-light);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-audio {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #bae6fd;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
    }
    .btn-audio:hover { background: #bae6fd; }

    .word-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
    }

    .word-card {
      background: white;
      border-radius: 14px;
      border: 1px solid var(--border);
      padding: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .word-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,0,0,0.06);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }

    .word-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary-dark);
    }

    .word-phonetic {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .word-meaning {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin: 10px 0 6px 0;
    }

    .word-example {
      font-size: 13px;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 8px 10px;
      border-radius: 8px;
      margin-top: 8px;
    }

    .badge-unit {
      font-size: 11px;
      background: #fef3c7;
      color: #b45309;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    /* Flashcard Style */
    .flashcard-wrapper {
      perspective: 1000px;
      max-width: 420px;
      margin: 40px auto;
    }

    .flashcard {
      background: white;
      border: 2px solid var(--border);
      border-radius: 20px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      cursor: pointer;
      position: relative;
    }

    /* Quiz Style */
    .quiz-container {
      background: white;
      border-radius: 18px;
      border: 1px solid var(--border);
      padding: 28px;
      max-width: 600px;
      margin: 20px auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }

    .quiz-options {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .quiz-opt-btn {
      padding: 14px 18px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    .quiz-opt-btn:hover { border-color: var(--primary); background: var(--primary-light); }
    .quiz-opt-btn.correct { background: #dcfce7; border-color: #22c55e; color: #15803d; }
    .quiz-opt-btn.wrong { background: #fee2e2; border-color: #ef4444; color: #b91c1c; }

    /* Form Style */
    .form-panel {
      background: white;
      border-radius: 16px;
      border: 1px solid var(--border);
      padding: 24px;
      max-width: 600px;
      margin: 0 auto;
    }

    .form-item {
      margin-bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
  </style>
</head>
<body>

  <header>
    <h1>英文詞彙小偵探</h1>
    <p>國中八年級 G8 核心單字與聽力特訓</p>
  </header>

  <nav>
    <button class="nav-btn active" onclick="switchTab('vocab')">📚 單字庫</button>
    <button class="nav-btn" onclick="switchTab('card')">🃏 翻卡記憶</button>
    <button class="nav-btn" onclick="switchTab('quiz')">🕵️ 偵探測驗</button>
    <button class="nav-btn" onclick="switchTab('g8')">⚙️ G8</button>
  </nav>

  <main>
    <!-- 單字庫 Panel -->
    <section id="panel-vocab">
      <div class="filter-bar">
        <div class="select-group">
          <label><strong>選擇單元：</strong></label>
          <select id="unitSelect" onchange="renderVocabGrid()"></select>
        </div>
        <span id="wordCountBadge" style="font-size: 13px; color: var(--text-muted);">共 0 個單字</span>
      </div>
      <div id="vocabGrid" class="word-grid"></div>
    </section>

    <!-- 翻卡練習 Panel -->
    <section id="panel-card" style="display:none;">
      <div class="filter-bar">
        <div class="select-group">
          <label><strong>單元：</strong></label>
          <select id="cardUnitSelect" onchange="resetCard()"></select>
        </div>
        <span id="cardProgress" style="font-size: 13px; color: var(--text-muted);">1 / 1</span>
      </div>
      <div class="flashcard-wrapper">
        <div class="flashcard" onclick="flipCard()">
          <span class="badge-unit" id="cardUnitBadge" style="position: absolute; top: 16px; left: 16px;">A Unit 1</span>
          <div id="cardFront">
            <h2 id="cardWord" style="font-size: 36px; color: var(--primary-dark); font-weight: 800;">Word</h2>
            <p id="cardPhonetic" style="color: var(--text-muted); margin-top: 6px;">/phonetic/</p>
            <button class="btn btn-audio" style="margin-top: 16px;" onclick="event.stopPropagation(); playCurrentCardAudio();">🔊 發音</button>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 24px;">點擊卡片查看中文解釋</p>
          </div>
          <div id="cardBack" style="display:none;">
            <h3 id="cardMeaning" style="font-size: 26px; font-weight: 700; color: #0f172a;">釋義</h3>
            <p id="cardExample" class="word-example" style="margin-top: 14px; text-align: left;"></p>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 24px;">點擊翻回正面</p>
          </div>
        </div>
        <div style="display: flex; justify-content: center; gap: 16px; margin-top: 20px;">
          <button class="btn btn-primary" onclick="prevCard()">上一張</button>
          <button class="btn btn-primary" onclick="nextCard()">下一張</button>
        </div>
      </div>
    </section>

    <!-- 測驗 Panel -->
    <section id="panel-quiz" style="display:none;">
      <div class="quiz-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
          <span class="badge-unit" id="quizUnitBadge">A Unit 1</span>
          <span id="quizScore" style="font-weight: 700; color: var(--secondary);">得分: 0</span>
        </div>
        <div style="text-align: center; margin: 20px 0;">
          <h2 id="quizQuestion" style="font-size: 32px; color: var(--primary-dark); font-weight: 800;">Question</h2>
          <button class="btn btn-audio" style="margin-top: 10px;" onclick="playQuizAudio()">🔊 聽發音</button>
        </div>
        <div id="quizOptions" class="quiz-options"></div>
        <div style="margin-top: 24px; text-align: right;">
          <button class="btn btn-primary" onclick="nextQuizQuestion()">下一題 ➔</button>
        </div>
      </div>
    </section>

    <!-- G8 管理 Panel (原新增題庫) -->
    <section id="panel-g8" style="display:none;">
      <div class="form-panel">
        <h2 style="font-size: 18px; font-weight: 700; margin-bottom: 16px; color: var(--primary-dark);">新增 G8 單字資料</h2>
        <div class="form-item">
          <label><strong>選擇單元 (A Unit)：</strong></label>
          <select id="newWordUnit">
            <option value="A Unit 1">A Unit 1</option>
            <option value="A Unit 2">A Unit 2</option>
            <option value="A Unit 3">A Unit 3</option>
            <option value="A Unit 4">A Unit 4</option>
          </select>
        </div>
        <div class="form-item">
          <label><strong>英文單字：</strong></label>
          <input type="text" id="newWordText" placeholder="例如：experience">
        </div>
        <div class="form-item">
          <label><strong>音標 (選填)：</strong></label>
          <input type="text" id="newWordPhonetic" placeholder="例如：/ɪkˈspɪr.i.əns/">
        </div>
        <div class="form-item">
          <label><strong>中文釋義：</strong></label>
          <input type="text" id="newWordMeaning" placeholder="例如：經驗；經歷">
        </div>
        <div class="form-item">
          <label><strong>例句 (選填)：</strong></label>
          <textarea id="newWordExample" rows="2" placeholder="英文例句..."></textarea>
        </div>
        <button class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 8px;" onclick="addNewWord()">儲存至 G8 題庫</button>
      </div>
    </section>
  </main>

  <script>
    // 預載 G8 核心單字資料庫 (A Unit 格式)
    const DEFAULT_G8_DATA = [
      { unit: "A Unit 1", word: "experience", phonetic: "/ɪkˈspɪr.i.əns/", meaning: "經驗；體驗", example: "It was a wonderful experience for our class." },
      { unit: "A Unit 1", word: "encourage", phonetic: "/ɪnˈkɝː.ɪdʒ/", meaning: "鼓勵；激勵", example: "The teacher encouraged us to speak English." },
      { unit: "A Unit 1", word: "volunteer", phonetic: "/ˌvɑː.lənˈtɪr/", meaning: "志工；自願做", example: "Many students volunteer at the library on weekends." },
      { unit: "A Unit 1", word: "schedule", phonetic: "/ˈskedʒ.uːl/", meaning: "行程表；時間表", example: "Let's check the exam schedule." },
      { unit: "A Unit 2", word: "protect", phonetic: "/prəˈtekt/", meaning: "保護；防衛", example: "We should protect animals and forests." },
      { unit: "A Unit 2", word: "environment", phonetic: "/ɪnˈvaɪ.rən.mənt/", meaning: "自然環境", example: "Plastic bags do harm to the environment." },
      { unit: "A Unit 2", word: "pollution", phonetic: "/pəˈluː.ʃən/", meaning: "污染", example: "Air pollution is getting serious in big cities." },
      { unit: "A Unit 2", word: "recycle", phonetic: "/ˌriːˈsaɪ.kəl/", meaning: "資源回收", example: "Remember to recycle bottles and cans." },
      { unit: "A Unit 3", word: "technology", phonetic: "/tekˈnɑː.lə.dʒi/", meaning: "科技；技術", example: "Modern technology makes communication easier." },
      { unit: "A Unit 3", word: "invent", phonetic: "/ɪnˈvent/", meaning: "發明；創造", example: "Who invented the telephone?" },
      { unit: "A Unit 3", word: "convenient", phonetic: "/kənˈviː.ni.ənt/", meaning: "便利的；方便的", example: "Online shopping is fast and convenient." },
      { unit: "A Unit 4", word: "traditional", phonetic: "/trəˈdɪʃ.ən.əl/", meaning: "傳統的", example: "We eat moon cakes during the traditional festival." },
      { unit: "A Unit 4", word: "celebrate", phonetic: "/ˈsel.ə.breɪt/", meaning: "慶祝", example: "How will your family celebrate the New Year?" },
      { unit: "A Unit 4", word: "delicious", phonetic: "/dɪˈlɪʃ.əs/", meaning: "美味的", example: "Mom made a delicious chocolate cake." }
    ];

    let wordDatabase = JSON.parse(localStorage.getItem('g8_word_db')) || DEFAULT_G8_DATA;

    // 語音播放核心函式 (全面相容 Android / iOS / 電腦)
    function playAudio(text) {
      if (!('speechSynthesis' in window)) {
        alert("您的載具不支援語音朗讀功能");
        return;
      }
      window.speechSynthesis.cancel();
      setTimeout(() => {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        utter.rate = 0.85;
        utter.pitch = 1.0;
        const voices = window.speechSynthesis.getVoices();
        const enVoice = voices.find(v => v.lang === 'en-US' || v.lang.startsWith('en'));
        if (enVoice) utter.voice = enVoice;
        window.speechSynthesis.speak(utter);
      }, 50);
    }

    if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // 分頁切換
    function switchTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('panel-vocab').style.display = tab === 'vocab' ? 'block' : 'none';
      document.getElementById('panel-card').style.display = tab === 'card' ? 'block' : 'none';
      document.getElementById('panel-quiz').style.display = tab === 'quiz' ? 'block' : 'none';
      document.getElementById('panel-g8').style.display = tab === 'g8' ? 'block' : 'none';

      if (tab === 'vocab') renderVocabGrid();
      if (tab === 'card') resetCard();
      if (tab === 'quiz') startQuiz();
    }

    // 初始化下拉選單
    function getUnits() {
      const set = new Set(wordDatabase.map(w => w.unit));
      return Array.from(set).sort();
    }

    function initUnitSelects() {
      const units = getUnits();
      const selectors = ['unitSelect', 'cardUnitSelect'];
      selectors.forEach(id => {
        const el = document.getElementById(id);
        el.innerHTML = '<option value="ALL">全部 A Unit</option>' + 
          units.map(u => `<option value="${u}">${u}</option>`).join('');
      });
    }

    // 單字庫渲染
    function renderVocabGrid() {
      const selectedUnit = document.getElementById('unitSelect').value || 'ALL';
      const container = document.getElementById('vocabGrid');
      const filtered = selectedUnit === 'ALL' 
        ? wordDatabase 
        : wordDatabase.filter(w => w.unit === selectedUnit);

      document.getElementById('wordCountBadge').innerText = `共 ${filtered.length} 個單字`;

      container.innerHTML = filtered.map(item => `
        <div class="word-card">
          <div>
            <div class="card-top">
              <span class="badge-unit">${item.unit}</span>
              <button class="btn btn-audio" onclick="playAudio('${item.word}')">🔊 發音</button>
            </div>
            <div class="word-title">${item.word}</div>
            <div class="word-phonetic">${item.phonetic || ''}</div>
            <div class="word-meaning">${item.meaning}</div>
          </div>
          ${item.example ? `
            <div class="word-example">
              <strong>例：</strong>${item.example}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    // 翻卡練習邏輯
    let cardList = [];
    let currentCardIdx = 0;
    let isFlipped = false;

    function resetCard() {
      const selectedUnit = document.getElementById('cardUnitSelect').value || 'ALL';
      cardList = selectedUnit === 'ALL' ? [...wordDatabase] : wordDatabase.filter(w => w.unit === selectedUnit);
      currentCardIdx = 0;
      isFlipped = false;
      renderCard();
    }

    function renderCard() {
      if (cardList.length === 0) return;
      const card = cardList[currentCardIdx];
      document.getElementById('cardProgress').innerText = `${currentCardIdx + 1} / ${cardList.length}`;
      document.getElementById('cardUnitBadge').innerText = card.unit;
      document.getElementById('cardWord').innerText = card.word;
      document.getElementById('cardPhonetic').innerText = card.phonetic || '';
      document.getElementById('cardMeaning').innerText = card.meaning;
      document.getElementById('cardExample').innerText = card.example || '無例句';

      document.getElementById('cardFront').style.display = isFlipped ? 'none' : 'block';
      document.getElementById('cardBack').style.display = isFlipped ? 'block' : 'none';
    }

    function flipCard() {
      isFlipped = !isFlipped;
      renderCard();
    }

    function nextCard() {
      if (currentCardIdx < cardList.length - 1) {
        currentCardIdx++;
        isFlipped = false;
        renderCard();
      }
    }

    function prevCard() {
      if (currentCardIdx > 0) {
        currentCardIdx--;
        isFlipped = false;
        renderCard();
      }
    }

    function playCurrentCardAudio() {
      if (cardList[currentCardIdx]) playAudio(cardList[currentCardIdx].word);
    }

    // 測驗邏輯
    let quizWord = null;
    let quizScore = 0;

    function startQuiz() {
      quizScore = 0;
      document.getElementById('quizScore').innerText = `得分: ${quizScore}`;
      nextQuizQuestion();
    }

    function nextQuizQuestion() {
      if (wordDatabase.length < 4) {
        alert("單字庫數量不足以產生測驗！");
        return;
      }
      quizWord = wordDatabase[Math.floor(Math.random() * wordDatabase.length)];
      document.getElementById('quizUnitBadge').innerText = quizWord.unit;
      document.getElementById('quizQuestion').innerText = quizWord.word;

      playAudio(quizWord.word);

      // 產生 4 個選項
      const options = [quizWord.meaning];
      while (options.length < 4) {
        const rand = wordDatabase[Math.floor(Math.random() * wordDatabase.length)].meaning;
        if (!options.includes(rand)) options.push(rand);
      }
      options.sort(() => Math.random() - 0.5);

      const optsContainer = document.getElementById('quizOptions');
      optsContainer.innerHTML = options.map(opt => `
        <button class="quiz-opt-btn" onclick="checkAnswer(this, '${opt}')">${opt}</button>
      `).join('');
    }

    function playQuizAudio() {
      if (quizWord) playAudio(quizWord.word);
    }

    function checkAnswer(btn, selected) {
      const isCorrect = selected === quizWord.meaning;
      document.querySelectorAll('.quiz-opt-btn').forEach(b => {
        b.disabled = true;
        if (b.innerText === quizWord.meaning) b.classList.add('correct');
      });
      if (isCorrect) {
        btn.classList.add('correct');
        quizScore += 10;
        document.getElementById('quizScore').innerText = `得分: ${quizScore}`;
      } else {
        btn.classList.add('wrong');
      }
    }

    // G8 題庫新增邏輯
    function addNewWord() {
      const unit = document.getElementById('newWordUnit').value;
      const word = document.getElementById('newWordText').value.trim();
      const phonetic = document.getElementById('newWordPhonetic').value.trim();
      const meaning = document.getElementById('newWordMeaning').value.trim();
      const example = document.getElementById('newWordExample').value.trim();

      if (!word || !meaning) {
        alert("請至少輸入單字與中文釋義！");
        return;
      }

      wordDatabase.push({ unit, word, phonetic, meaning, example });
      localStorage.setItem('g8_word_db', JSON.stringify(wordDatabase));

      alert(`已成功將「${word}」加入至 ${unit}！`);
      document.getElementById('newWordText').value = '';
      document.getElementById('newWordPhonetic').value = '';
      document.getElementById('newWordMeaning').value = '';
      document.getElementById('newWordExample').value = '';

      initUnitSelects();
    }

    // 啟動初始化
    initUnitSelects();
    renderVocabGrid();
  </script>
</body>
</html>
